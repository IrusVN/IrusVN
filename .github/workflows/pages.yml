# Deploy Dot Editor + banner preview lên GitHub Pages.
# Repo IrusVN/IrusVN -> site tại https://irusvn.github.io/IrusVN/
# (landing) và /tools/dot-editor/ (editor). Cấu trúc giữ nguyên như repo
# nên đường dẫn tương đối ../../dark.svg trong editor vẫn trúng đích.
# Lần đầu phải bật Pages: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p dist/tools
          # landing + banner SVG thật để xem trực tiếp trên site
          cp .github/pages/index.html dist/
          cp dark.svg light.svg dist/
          # editor nguyên vẹn từ repo
          cp -r tools/dot-editor dist/tools/dot-editor
          # .npy cho nút "☁ Từ repo" của editor
          cp portrait_dark.npy portrait_light.npy dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
